name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  static:
    name: static-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     target: x86_64-unknown-linux-musl,  arch: amd64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package tarball
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')
          name="totalmapper-static-linux-${{ matrix.arch }}-${version}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/totalmapper" "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
      - uses: actions/upload-artifact@v4
        with:
          name: static-${{ matrix.arch }}
          path: dist/*.tar.gz

  deb:
    name: deb-${{ matrix.codename }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, codename: jammy }
          - { runner: ubuntu-24.04, codename: noble }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-deb --locked
      - run: cargo deb --deb-revision=${{ matrix.codename }}
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.codename }}
          path: target/debian/*.deb

  release:
    needs: [static, deb]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.deb
